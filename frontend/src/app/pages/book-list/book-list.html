<div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
  <header>
    <h1>Mina böcker</h1>
    <p class="text-body-secondary">{{ books().length }} böcker i din bokhylla</p>
  </header>
  <a routerLink="/books/new" class="btn btn-primary">
    <i class="fa-solid fa-plus"></i>
    Lägg till bok
  </a>
</div>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 mt-1">
  @for (book of books(); track book.id) {
    <app-book-card [book]="book" (delete)="deleteBook($event)" />
  } @empty {
    <p>Lägg till böcker med knappen ovan</p>
  }
</div>
