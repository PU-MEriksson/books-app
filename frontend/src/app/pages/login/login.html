<div class="card">
  <div class="card-body d-flex flex-column">
    <h1 class="card-title text-center">
      <i class="fa-solid fa-book-open text-primary me-2"></i>Bokhyllan
    </h1>
    <p class="text-body-secondary text-center">Dina böcker och citat, samlade</p>

    @if (errorMessage()) {
      <div class="alert alert-danger" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i>{{ errorMessage() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-2">
      <div>
        <label for="username" class="form-label">Användarnamn</label>
        <input
          type="text"
          class="form-control"
          formControlName="username"
          id="username"
          autocomplete="username"
        />
      </div>
      <div>
        <label for="password" class="form-label">Lösenord</label>
        <input
          type="password"
          class="form-control"
          formControlName="password"
          id="password"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        <i class="fa-solid fa-right-to-bracket me-2"> </i>
        Logga in
      </button>
    </form>
    <p class="mt-4 text-center">Inget konto än? <a routerLink="/register">Registrera dig</a></p>
  </div>
</div>
