<div class="register-page">
  <h1 class="mb-4"><i class="fa-solid fa-user-plus me-2"></i>Skapa konto</h1>

  @if (errorMessage()) {
    <div class="alert alert-danger" role="alert">
      <i class="fa-solid fa-circle-exclamation me-2"></i>{{ errorMessage() }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label for="username" class="form-label">Användarnamn</label>
      <input
        type="text"
        class="form-control"
        formControlName="username"
        id="username"
        autocomplete="username"
      />
      <div class="form-text">Minst 3 tecken.</div>
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Lösenord</label>
      <input
        type="password"
        class="form-control"
        formControlName="password"
        id="password"
        autocomplete="new-password"
      />
      <div class="form-text">Minst 6 tecken.</div>
    </div>
    <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">
      Skapa konto
    </button>
  </form>

  <p class="mt-4 text-center">Har du redan ett konto? <a routerLink="/login">Logga in</a></p>
</div>
