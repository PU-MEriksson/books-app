<form class="book-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="mb-4">
    <label for="title" class="form-label">Titel</label>
    <input
      type="text"
      class="form-control"
      formControlName="title"
      id="title"
      placeholder="t.ex Röda rummet"
    />
  </div>
  <div class="mb-4">
    <label for="author" class="form-label">Författare</label>
    <input
      type="text"
      class="form-control"
      formControlName="author"
      id="author"
      placeholder="t.ex August Strindberg"
    />
  </div>
  <div class="mb-4">
    <label for="publicationDate" class="form-label">Publiceringsdatum</label>
    <input
      type="date"
      class="form-control"
      formControlName="publicationDate"
      id="publicationDate"
    />
  </div>
  <div class="d-flex justify-content-end gap-2">
    <a routerLink="/" class="btn btn-outline-secondary">Avbryt</a>
    <button type="submit" class="btn btn-primary">Spara bok</button>
  </div>
</form>
