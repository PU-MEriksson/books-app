<form class="book-form">
  <form>
    <!-- form action? -->
    <div class="mb-4">
      <label for="title" class="form-label">Titel</label>
      <input type="text" class="form-control" placeholder="t.ex Röda rummet" />
    </div>
    <div class="mb-4">
      <label for="author" class="form-label">Författare</label>
      <input type="text" class="form-control" placeholder="t.ex August Strindberg" />
    </div>
    <div class="mb-4">
      <label for="title" class="form-label">Publiceringsdatum</label>
      <input type="date" class="form-control" placeholder="t.ex Röda rummet" />
    </div>
    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-secondary">Avbryt</button>
      <button type="submit" class="btn btn-primary">Spara bok</button>
