<nav class="navbar navbar-expand-md border-bottom">
  <div class="container">
    @if (isLoggedIn()) {
      <a class="navbar-brand" routerLink="/">
        <i class="fa-solid fa-book-open me-2 text-primary"></i>Bokhyllan
      </a>

      <button
        class="navbar-toggler order-first me-2 ghost-btn"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Växla navigering"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
    }

    <button
      type="button"
      class="btn btn-outline-secondary rounded-circle theme-toggle d-flex align-items-center justify-content-center ms-auto ms-md-3 order-md-last"
      (click)="toggleTheme()"
      [attr.aria-label]="theme() === 'light' ? 'Byt till mörkt tema' : 'Byt till ljust tema'"
      [title]="theme() === 'light' ? 'Byt till mörkt tema' : 'Byt till ljust tema'"
    >
      <i
        class="fa-solid"
        [class.fa-moon]="theme() === 'light'"
        [class.fa-circle-half-stroke]="theme() === 'dark'"
      ></i>
    </button>

    @if (isLoggedIn()) {
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto nav-underline">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              Böcker
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/quotes"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              Mina citat
            </a>
          </li>
        </ul>

        <ul class="navbar-nav">
          <li class="nav-item">
            <button type="button" class="nav-link" (click)="onLogOut()">
              <i class="fa-solid fa-right-from-bracket me-2"></i>Logga ut
            </button>
          </li>
        </ul>
      </div>
    }
  </div>
</nav>

<main class="container py-4">
  <router-outlet />
</main>
