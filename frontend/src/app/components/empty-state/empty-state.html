<div class="empty-state text-center py-5 px-3">
  <div class="empty-state-icon mb-3" aria-hidden="true">
    <i [class]="'fa-solid ' + icon()"></i>
  </div>

  <h2 class="h5">{{ title() }}</h2>

  @if (message()) {
    <p class="text-body-secondary mb-4">{{ message() }}</p>
  }

  <ng-content />
</div>
